# 100 Journeys app locations, shared by the HTTP and HTTPS server blocks.
# Installed to /etc/nginx/snippets/100-journeys-locations.conf by deploy/aws/server/bootstrap.sh.

access_log /var/log/nginx/100-journeys.access.log;
error_log /var/log/nginx/100-journeys.error.log warn;

client_max_body_size 5m;
limit_req_status 429;

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 1024;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location /static/ {
    alias /opt/100-journeys/current/web/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
}

location /api/auth/ {
    limit_req zone=journeys_auth_limit burst=10 nodelay;
    proxy_pass http://journeys_api;
    include /etc/nginx/snippets/100-journeys-proxy.conf;
}

location /api/ {
    limit_req zone=journeys_api_limit burst=20 nodelay;
    proxy_pass http://journeys_api;
    include /etc/nginx/snippets/100-journeys-proxy.conf;
}

location /uploads/ {
    proxy_pass http://journeys_api;
    include /etc/nginx/snippets/100-journeys-proxy.conf;
}

location / {
    proxy_pass http://journeys_api;
    include /etc/nginx/snippets/100-journeys-proxy.conf;
}
