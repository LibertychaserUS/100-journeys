  <!-- While the static opening shows, the page and the bar are night in both themes (no light
       frame, no grey bar over the picture); off once the app has drawn its first page. -->

    html[data-boot="home"]:not([data-booted]) body { background: #07080b; }
    html[data-boot="home"]:not([data-booted]) #main-nav { background: linear-gradient(to bottom, rgba(5, 6, 8, .55), rgba(5, 6, 8, 0)); border-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }

  <!-- Theme before first paint: saved choice, else the OS preference. -->
  <script>
    (function () {
      // Share links (/j/<slug>) open the journey inside the app.
      var share = /^\/j\/([a-z0-9-]+)\/?$/.exec(location.pathname);
      if (share) history.replaceState(null, '', '/' + location.search + '#/journey/' + share[1]);
      // The reader's language before the first paint (same rule as i18n.js), so text is set in that
      // language's fonts from the start.
      var bl = null;
      try { bl = localStorage.getItem('lang'); } catch (e) {}
      if (bl !== 'zh' && bl !== 'en') bl = /^zh/i.test((navigator.languages && navigator.languages[0]) || navigator.language || 'zh') ? 'zh' : 'en';
      document.documentElement.lang = bl === 'zh' ? 'zh-CN' : 'en';
      // The home opening image starts downloading before anything else (AVIF; others use the JPEG).
      if (!location.hash || location.hash === '#/' || location.hash === '#') {
        var hp = document.createElement('link');
        hp.rel = 'preload'; hp.as = 'image'; hp.type = 'image/avif'; hp.setAttribute('fetchpriority', 'high');
        hp.href = '/static/assets/images/generated/hero-taoyuan.1600.avif';
        hp.setAttribute('imagesrcset', '/static/assets/images/generated/hero-taoyuan.960.avif 960w, /static/assets/images/generated/hero-taoyuan.1600.avif 1600w, /static/assets/images/generated/hero-taoyuan.1900.avif 1900w');
        hp.setAttribute('imagesizes', 'max(100vw, 177.8svh)');
        document.head.appendChild(hp);
        // The static opening below shows at once, in the reader's language, until the app takes over.
        document.documentElement.setAttribute('data-boot', 'home');
        document.documentElement.setAttribute('data-boot-lang', bl);
        // The opening title's font slices, so the first paint already uses the story serif.
        // fonts:begin (written by scripts/fonts/build.py)
        var fp = bl === 'zh' ? ["story-serif-700-02.49298fa6bf.woff2", "story-serif-700-18.6926b5a54e.woff2"] : ["story-serif-latin-700.fc6385aa1b.woff2"];
        fp.forEach(function (f) { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; l.href = '/static/assets/fonts/' + f; document.head.appendChild(l); });
        // fonts:end
      }
      // A journey page starts fetching its data before the scripts arrive.
      var deep = /^#\/journey\/([a-z0-9-]+)/.exec(location.hash);
      if (deep && window.fetch) {
        var lang = null;
        try { lang = localStorage.getItem('lang'); } catch (e) {}
        if (lang !== 'zh' && lang !== 'en') lang = /^zh/i.test((navigator.languages && navigator.languages[0]) || navigator.language || 'zh') ? 'zh' : 'en';
        var early = fetch('/api/journeys/' + deep[1] + '?lang=' + lang).then(function (r) { return r.ok ? r.json() : Promise.reject(r); });
        window.__journeyPrefetch = { slug: deep[1], lang: lang, promise: early };
        // …and its opening image, so it downloads while the scripts are still on their way.
        early.then(function (res) {
          var d = res && res.data;
          var src = d && ((d.scene && d.scene.images && d.scene.images.hero) || d.image_url);
          if (!src) return;
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.setAttribute('fetchpriority', 'high');
          var m = /\/generated\/[^/]+\/cover\.jpg$/.test(src) ? [480, 720, 1120] : /\/generated\/card-[^/]+\.jpg$/.test(src) ? [480, 720] : /\/generated\/[^/]+\/hero\.jpg$/.test(src) ? [960, 1536] : null;
          if (m) {
            // A typed preload is skipped by browsers that can't decode AVIF (they use the JPEG).
            l.type = 'image/avif';
            l.setAttribute('imagesrcset', m.map(function (w) { return src.replace(/\.jpg$/, '.' + w + '.avif') + ' ' + w + 'w'; }).join(', '));
            l.setAttribute('imagesizes', '100vw');
            l.href = src.replace(/\.jpg$/, '.' + m[m.length - 1] + '.avif');
          } else l.href = src;
          document.head.appendChild(l);
        }).catch(function () {});
      }
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', saved === 'light' || saved === 'dark' ? saved : (prefersLight ? 'light' : 'dark'));
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute('content', document.documentElement.getAttribute('data-theme') === 'light' ? '#f3f3f1' : '#0d0f13');
    })();
  </script>
