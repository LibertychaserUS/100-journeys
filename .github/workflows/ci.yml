name: CI/CD

# CI runs on every push and pull request. The deploy job runs only after all CI jobs
# pass, for pushes to main (or a manual run), and only through the `production`
# environment, which is restricted to the main branch.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Go, JS, docs, and Nginx
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx sqlite3

      - name: Download Go modules
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Check frontend JavaScript syntax
        run: find web/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check deployment script syntax
        run: |
          for f in \
            scripts/deploy/init-demo-data.sh \
            scripts/deploy/local-one-click.sh \
            scripts/deploy/sync-tencent.sh \
            scripts/backup-sqlite.sh \
            scripts/nginx/render-local-config.sh \
            scripts/deploy/aws/*.sh \
            deploy/aws/server/*.sh; do
            bash -n "$f"
          done
          python3 -m py_compile scripts/deploy/aws/smoke.py

      - name: Regenerate code-derived documentation
        run: |
          python3 scripts/docs/generate_project_artifacts.py
          node scripts/docs/build_app_xlsx.mjs

      - name: Local one-click smoke
        run: |
          scripts/deploy/local-one-click.sh --no-nginx --public-port 18180 --api-port 18181 --db ./data/ci-local-one-click.db
          scripts/deploy/local-one-click.sh --stop

      - name: Ensure generated docs are committed
        run: git diff --exit-code -- app.xlsx docs/generated

      - name: Render local Nginx config
        run: scripts/nginx/render-local-config.sh 18080 18081

      - name: Check local Nginx config
        run: nginx -t -c "$PWD/deploy/nginx.local.conf" -p "$PWD/.nginx"

      - name: Run stress smoke profile
        run: |
          STRESS_PUBLIC_REQUESTS=120 \
          STRESS_ANALYTICS_EVENTS=500 \
          STRESS_USERS=10 \
          STRESS_ORDERS=30 \
          STRESS_ADMIN_REQUESTS=20 \
          STRESS_IMAGE_REQUESTS=120 \
          go test -tags stress ./tests/stress -run TestStress -count=1 -timeout=120s

  k6-smoke:
    name: k6 through Nginx
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Start Go server
        run: |
          mkdir -p tmp data
          PORT=18081 DB_PATH=./data/ci-k6.db go run ./cmd/server > tmp/ci-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat tmp/ci-server.log
          exit 1

      - name: Start Nginx proxy
        run: |
          scripts/nginx/render-local-config.sh 18080 18081
          nginx -c "$PWD/deploy/nginx.local.conf" -p "$PWD/.nginx"
          curl -fsS http://127.0.0.1:18080/api/health
          curl -fsSI http://127.0.0.1:18080/static/css/tokens.css | grep -qi 'content-type: text/css'
          curl -fsSI http://127.0.0.1:18080/static/js/router.js | grep -Eqi 'content-type: (application|text)/javascript'
          curl -fsSI http://127.0.0.1:18080/static/assets/images/generated/hero-taoyuan.jpg | grep -qi 'content-type: image/jpeg'

      - name: Run public content k6 smoke
        run: BASE_URL=http://127.0.0.1:18080 VUS=5 DURATION=10s k6 run tests/load/public-content-flow.k6.js

      - name: Run order/payment k6 smoke
        run: BASE_URL=http://127.0.0.1:18080 VUS=3 DURATION=10s k6 run tests/load/order-payment-audit.k6.js

      - name: Run image cache k6 smoke
        run: BASE_URL=http://127.0.0.1:18080 VUS=10 DURATION=10s k6 run tests/load/image-static-cache.k6.js

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Warm the Go build cache
        run: go build -o /dev/null ./cmd/server

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results
          retention-days: 7

  deploy:
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest
    needs: [verify, k6-smoke, e2e]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: production
      url: https://${{ vars.SERVER_NAME }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      LIGHTSAIL_INSTANCE: 100-journeys
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      SERVER_NAME: ${{ vars.SERVER_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-100-journeys-${{ github.run_id }}
          aws-region: us-east-1

      - name: Prepare SSH key and host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          echo "SSH_KEY=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"

      - name: Open SSH for this runner only
        run: |
          cidr="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')/32"
          echo "RUNNER_CIDR=$cidr" >> "$GITHUB_ENV"
          aws lightsail open-instance-public-ports --instance-name "$LIGHTSAIL_INSTANCE" \
            --port-info "fromPort=22,toPort=22,protocol=tcp,cidrs=$cidr" >/dev/null
          for _ in $(seq 1 20); do
            if ssh -i "$SSH_KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=5 "ubuntu@$DEPLOY_HOST" true; then
              exit 0
            fi
            sleep 3
          done
          echo "SSH did not become reachable" >&2
          exit 1

      - name: Deploy release
        run: scripts/deploy/aws/deploy.sh "$DEPLOY_HOST"

      - name: Public smoke test
        id: smoke
        run: python3 scripts/deploy/aws/smoke.py "https://$SERVER_NAME" --read-only

      - name: Roll back after a failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          ssh -i "$SSH_KEY" -o IdentitiesOnly=yes -o BatchMode=yes "ubuntu@$DEPLOY_HOST" \
            sudo /opt/100-journeys/current/deploy/aws/server/activate-release.sh --previous

      - name: Close SSH for this runner
        if: always() && env.RUNNER_CIDR != ''
        run: |
          aws lightsail close-instance-public-ports --instance-name "$LIGHTSAIL_INSTANCE" \
            --port-info "fromPort=22,toPort=22,protocol=tcp,cidrs=$RUNNER_CIDR" >/dev/null
          echo "closed port 22 for the runner"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
