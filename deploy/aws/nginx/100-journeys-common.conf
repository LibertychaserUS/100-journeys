# http-context definitions for 100 Journeys (upstream + rate limits).
# Installed to /etc/nginx/conf.d/100-journeys-common.conf.

upstream journeys_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Addresses listed in /etc/nginx/100-journeys-limit-exempt.conf ("<cidr> 1;")
# skip rate limiting. Keep that file empty except during operator test runs
# (e.g. the Playwright suite, which registers many users in a row).
geo $journeys_limit_exempt {
    default 0;
    include /etc/nginx/100-journeys-limit-exempt.conf;
}

map $journeys_limit_exempt $journeys_limit_key {
    0 $binary_remote_addr;
    1 "";
}

limit_req_zone $journeys_limit_key zone=journeys_api_limit:10m rate=10r/s;
limit_req_zone $journeys_limit_key zone=journeys_auth_limit:10m rate=5r/m;
# The AI guide may call a paid LLM API, so it gets a much tighter per-IP budget.
limit_req_zone $journeys_limit_key zone=journeys_ai_limit:10m rate=6r/m;
